<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Effects playground</title>
    <link rel="stylesheet" href="../../docs/.vitepress/theme/code-font.css" />
    <style>
      :root { --rich-fragment-font: 15px/1.25 var(--rich-code-font-family); }
      body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--page-bg, #1e1e2e); color: var(--page-fg, #cdd6f4); }
      header { display: flex; gap: 16px; align-items: center; padding: 12px 20px; position: sticky; top: 0; background: var(--page-bg, #1e1e2e); z-index: 1; border-bottom: 1px solid #8884; }
      header h1 { font-size: 16px; margin: 0; }
      main { max-width: 1000px; margin: 0 auto; padding: 8px 20px 80px; }
      section { margin: 28px 0; padding-top: 12px; border-top: 1px solid #8884; }
      section h2 { margin: 0 0 4px; font-size: 18px; }
      section p { margin: 0 0 10px; opacity: 0.75; }
      .stage { display: grid; gap: 6px; margin-bottom: 12px; }
      .controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px 24px; }
      .control { display: grid; grid-template-columns: 110px 1fr 76px; gap: 8px; align-items: center; }
      .control span { opacity: 0.85; }
      .control input[type="number"], .control select { width: 100%; font: inherit; color: inherit; background: #8882; border: 1px solid #8884; border-radius: 4px; padding: 2px 4px; }
      .bar { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
      button, select, label.check { font: inherit; }
      button { color: inherit; background: #8883; border: 1px solid #8886; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
      .clock { opacity: 0.6; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <header>
      <h1>Effects playground</h1>
      <label>Theme <select id="theme"></select></label>
      <label class="check"><input type="checkbox" id="paused" /> pause all</label>
    </header>
    <main id="panels"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
