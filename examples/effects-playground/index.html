<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Effects playground</title>
    <!-- The docs' code font stack, Powerline face included: the terminals and the editors draw in it. -->
    <link rel="stylesheet" href="../../docs/.vitepress/theme/code-font.css" />
    <style>
      /* What the docs' editor (theme/playground-editor.ts) reads from the
         VitePress theme, in the docs' dark colour mode (custom.css). */
      :root {
        --vp-c-text-1: #dfdfd6;
        --vp-c-text-3: #6a6a71;
        --vp-code-block-bg: #161618;
        --vp-font-family-mono: var(--rich-code-font-family);
        --vp-code-font-size: 13px;
        --vp-c-brand-1: #a8b1ff;
        --vp-c-brand-soft: #646cff29;
        --vp-c-default-soft: #65758529;
        --vp-c-divider: #2e2e32;
        --rich-code-keyword: #c678dd;
        --rich-code-string: #98c379;
        --rich-code-number: #d19a66;
        --rich-code-comment: #7f848e;
        --rich-code-function: #61afef;
        --rich-code-type: #e5c07b;
        --rich-code-property: #e06c75;
        --rich-code-operator: #56b6c2;
      }
      body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #1b1b1f; color: var(--vp-c-text-1); }
      header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 12px 20px; position: sticky; top: 0; background: #1b1b1f; z-index: 2; border-bottom: 1px solid var(--vp-c-divider); }
      header h1 { font-size: 16px; margin: 0; }
      header p { margin: 0; opacity: 0.7; }
      .run-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      .run-slider { display: inline-flex; gap: 6px; align-items: center; }
      .run-slider output { min-width: 3em; font: 12px var(--rich-code-font-family); }
      input, select, button { font: inherit; color: inherit; background: #8882; border: 1px solid #8884; border-radius: 4px; padding: 2px 6px; }
      button { cursor: pointer; }
      main { max-width: 1400px; margin: 0 auto; padding: 8px 20px 80px; }
      section { margin: 28px 0; padding-top: 12px; border-top: 1px solid var(--vp-c-divider); }
      .bar { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
      .bar h2 { margin: 0; font-size: 18px; }
      .state { opacity: 0.7; }
      .state.exited { color: #f38ba8; opacity: 1; }
      .term { font: 14px var(--rich-code-font-family); width: max-content; max-width: 100%; overflow-x: auto; margin-top: 10px; }
      .panes { display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); gap: 16px; align-items: start; }
      .editor { max-height: 380px; overflow: auto; border: 1px solid var(--vp-c-divider); border-radius: 4px; }
      .sliders { display: grid; gap: 4px; max-height: 380px; overflow: auto; }
      .control { display: grid; grid-template-columns: minmax(0, 1fr) 140px 84px; gap: 8px; align-items: center; font: 12px var(--rich-code-font-family); }
      .control span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .control select { grid-column: span 2; }
      @media (max-width: 900px) { .panes { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Effects playground</h1>
      <p>Each effect's code from effects-feel/curves.ts. Edit it, move a slider, or change how it runs: each takes effect in place.</p>
      <p>A curve's <code>seconds</code> are curve time: each frame adds 0.25 × rate of it, whatever the fps, so 4 frames are one curve second. "real" is wall-clock time.</p>
      <span id="run-controls" class="run-controls"></span>
      <label>Font <input id="font-family" placeholder="installed family, e.g. JetBrainsMono Nerd Font" size="34" /></label>
      <label>or file <input id="font-url" placeholder="https://…/font.woff2" size="28" /></label>
    </header>
    <main id="panels"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
