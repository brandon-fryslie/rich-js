# Publish rich-js to npm from CI.
#
# Why this exists: rich-js had no publish automation, so every release was a
# manual `npm publish` from a laptop. npm now refuses that for legacy tokens
# ("Two-factor authentication or granular access token with bypass 2fa enabled
# is required to publish packages"), which turned a routine release into a hard
# block. CI publishing is the fix, and it is what the sibling repo
# (@promptctl/cc-candybar) already does.
#
# The trigger is the version tag, so the tag is the single source of truth for
# "this commit is released" — the workflow refuses to publish if the tag and
# package.json disagree, rather than silently shipping a mislabeled version.
#
# Publishing uses npm Trusted Publishing (OIDC) — brandon-release-vcr. There
# is no NPM_TOKEN secret; `npm publish` exchanges the publish job's Actions
# OIDC identity for a short-lived publish credential, gated by a trust
# relationship configured on npmjs.com (Package → Settings → Trusted
# Publisher). That trust binds THIS FILENAME (publish.yml) and THIS REPO, not
# the job — renaming the workflow file silently breaks publishing (npm falls
# back to "no credentials" and CI will start failing E401 on the next tag). If
# this file is ever renamed, the trust config on npmjs.com must be updated in
# the same change.
#
# Release procedure:
#   npm version <major|minor|patch> --no-git-tag-version   # bump on a branch
#   # PR, review, merge to master
#   git checkout master && git pull
#   git tag v$(node -p "require('./package.json').version") && git push --tags

name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  # Two jobs, and the boundary between them is the entire reason for the split:
  # `permissions` is granted per job, so no step can be scoped tighter than the
  # job it sits in. Everything that runs third-party code at scale — `npm ci`'s
  # install scripts, vite/vitepress and their plugin graph, a Chromium
  # download, real headless page execution — runs HERE, where there is no
  # `id-token`, and hands `dist/` forward as an artifact.
  #
  # The split became necessary when the demo gate moved onto the release path
  # (rich-workflows-0pr.1). Before that this job ran tsc and vitest; folding a
  # browser build into a process whose environment carries
  # ACTIONS_ID_TOKEN_REQUEST_TOKEN would have let a single compromised
  # transitive dependency request that token and mint a forged npm publish
  # credential. The gate got stricter and the credential got a smaller room to
  # stand in; both halves are the same change.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # [LAW:single-enforcer] The same gate means the same runtime, not just the
      # same step list: re-gating under a different Node than master ran is a
      # different experiment from the one that passed. This reads what ci.yml
      # reads, and ci.yml's setup-node step owns the argument for it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # [LAW:single-enforcer] The same gate master runs — one action, both
      # paths. A tag must not be able to publish something that does not
      # typecheck, whose tests fail, or whose browser demos are broken. Until
      # this step existed the third of those shipped: lint and test never touch
      # the bundle pipeline, so the release path was blind to precisely the
      # failure the headless-browser job was written to catch.
      - uses: ./.github/actions/gate

      # `dist/` is the only thing `package.json#files` ships. Not a gate step —
      # `lint` already typechecks with `--noEmit`, so this is artifact
      # production, and it belongs to the one path that produces an artifact.
      - run: npm run build

      - name: Hand dist to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # [LAW:effects-at-boundaries] The irreversible step and the credential that
  # authorizes it stand alone, in the smallest job that can perform them.
  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance — attests that this tarball was built by
      # this workflow from this commit, which is exactly the guarantee a manual
      # laptop publish cannot make.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # [LAW:one-source-of-truth] Two facts, two authorities: "which Node may a
      # consumer install this on" is `engines.node`, and "which Node runs the
      # release tooling" is this literal. Only the second is this job's
      # question — it never executes `src/`, since the tarball's contents were
      # compiled by `npm run build` over in the gate job and arrive here as an
      # artifact. It runs the npm CLI installed below, whose own constraint is
      # `^20.17.0 || >=22.9.0`, and `engines.node` (`>=20`) is not a subset of
      # that: Node 20.5 and every 21.x satisfy engines and are refused by npm
      # 11. Reading the version file here would cite a declaration that admits
      # runtimes this job cannot use.
      #
      # v7 is also the major that stopped exporting a dummy NODE_AUTH_TOKEN
      # beside `registry-url` (actions/setup-node#1558) — a placeholder that put
      # a non-functional token into .npmrc on exactly this OIDC publish path.
      #
      # No `cache: npm` — nothing in this job installs from the lockfile.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm CLI >= 11.5.1, which the bundled npm can
      # lag on some runner images — pin it rather than take what ships.
      - run: npm install -g npm@^11.5.1

      # No `npm ci` here, deliberately: installing the devDependency tree would
      # run every package's install scripts inside the OIDC-bearing job, which
      # is the thing the job split exists to prevent. Nothing on this path needs
      # node_modules — package.json declares no prepare/prepack/prepublishOnly,
      # and `files` is ["dist"], which arrives as the artifact.
      - name: Take dist from the gate job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # [LAW:no-silent-failure] A tag that disagrees with package.json is a
      # release-process bug, and publishing anyway would put a version on npm
      # that no git tag describes. Fail loudly, before the irreversible step.
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} does not match package.json version ${pkg}"
            exit 1
          fi
          echo "publishing ${pkg}"

      # No NODE_AUTH_TOKEN: npm CLI >= 11.5.1 detects the GitHub Actions OIDC
      # environment (id-token: write, above) and exchanges it for a
      # short-lived publish token automatically, gated by the trust
      # relationship configured on npmjs.com. Setting an explicit token here
      # would make npm use that token path instead and skip OIDC entirely.
      - name: Publish
        run: npm publish --access public --provenance
