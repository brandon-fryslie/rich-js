# [LAW:single-enforcer] One gate per concern: lint, unit tests, and the
# headless-browser demo gate all run in this single workflow. The
# demo gate (rich-demo-site-pek.5) builds the docs site and asserts every
# demo in docs/.vitepress/demos.json boots cleanly in real Chromium.
#
# [LAW:dataflow-not-control-flow] The set of demos under test comes from
# the manifest — the same JSON the VitePress config / paths file / landing
# page read. CI does not enumerate demos; it runs whatever the manifest says.

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # [LAW:one-source-of-truth] `package.json#engines.node` is the canonical
      # supported-runtime declaration; setup-node reads it via
      # `node-version-file` so the workflow cannot drift from it. The range
      # itself is deliberately not repeated here — this comment used to name it,
      # and to credit it to a transitive dependency, and both halves were false
      # by the time anyone read them. `test/seam/node-floor.test.ts` is what
      # decides the range now.
      #
      # What setup-node does with a range is pick the NEWEST version satisfying
      # it, not the oldest: the run at ^20.19.0 || >=22.12.0 logged "Resolved
      # package.json as ^20.19.0 || >=22.12.0" and then took 24.20.0. So this
      # job proves the package works at the top of its supported range and says
      # nothing about the floor.
      #
      # Nothing else does either, and this comment claimed otherwise until review
      # caught it: it called the tarball-under-the-lowest-Node check "a release
      # step", and `publish.yml` has no such step — it pins Node 22 and
      # publishes. That check was run by hand once, on the commit that set the
      # floor, and is recorded in its PR. Automating it is rich-packaging-8b7.
      # Read the gap as it is: a floor wrong because `src/` reached for a newer
      # Node's API is caught by nobody today, and a comment promising a safety
      # net is worse than the gap, because it stops anyone looking for one.
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Build the docs site so the headless gate has real output to probe.
      # No VITEPRESS_BASE override — the default `/rich-js/` matches the
      # baseURL in playwright.config.ts.
      - name: Build docs site
        run: npm run docs:build

      # `--with-deps` installs the system libraries Chromium needs on
      # ubuntu-latest (fonts, libnss, etc.). Chromium-only — we don't run
      # Webkit/Firefox; the bundle output is the same for every browser.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Headless-browser gate (demo pages)
        run: npm run test:demos

      # On failure, the HTML report (with traces + screenshots) is the
      # primary debugging artefact. Skip upload on green to keep the run
      # tidy.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
