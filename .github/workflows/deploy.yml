# [LAW:single-enforcer] Deployment is owned by this workflow alone.
# Every event that produces a deployable artifact (master push, PR)
# flows through the same pipeline; the multiplexer enforces the
# versioned-subdirectory layout for both cases.
#
# [LAW:one-source-of-truth] The deploy "slot" name is computed once
# (needs.slot.outputs.slot) and read by the deploy job's concurrency
# group, the VitePress build (via VITEPRESS_BASE) and the multiplexer
# action (via `version:`). Drift between the last two would 404 every
# asset on the deployed page; drift from the first lets one slot's run
# cancel another slot's pending deploy (rich-workflows-ui0d).
#
# [LAW:dataflow-not-control-flow] The same job runs on every event;
# variability lives in the slot value (`master` vs `pr-<N>`), not in
# whether steps execute. The shell branch on event_name produces a
# single output value — data, not control flow at the workflow level.

name: Deploy

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Slot is the version subdirectory name. Master push → `master`;
  # PR → `pr-<number>`. The multiplexer's auto-derivation produces
  # the same names, but passing `version:` explicitly ties the
  # build's base URL to the action's deploy slot via one shared
  # variable, so the two cannot drift. Its own job because a job-level
  # `concurrency:` can read `needs` outputs and never a step's.
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - id: slot
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "slot=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "slot=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: slot
    # One group per slot, not one for the site: GitHub keeps at most one
    # pending run per group and a newly queued run cancels it, whatever
    # `cancel-in-progress` says. A shared group let a PR run cancel the
    # pending master deploy. Per slot, newest wins, so cancelling the run
    # in progress too only drops work about to be overwritten. Runs for
    # different slots race on gh-pages; gh-pages-multiplexer v1.1.0 owns
    # that race (src/deploy.ts: non-force push, rebuild on a stale tip).
    concurrency:
      group: pages-deploy-${{ needs.slot.outputs.slot }}
      cancel-in-progress: true
    # [LAW:single-enforcer] Trust boundary lives at exactly one place.
    # For fork PRs, GitHub forces GITHUB_TOKEN to read-only (correctly —
    # untrusted PR code cannot have write access to the base repo), so
    # the push to gh-pages and the sticky comment would both fail. Skip
    # the deploy job entirely in that case. Fork PRs still get CI (via
    # ci.yml) for correctness checks; previewing fork PRs requires the
    # workflow_run pattern (build in untrusted ctx → deploy in trusted
    # ctx), which is out of scope for now. Master pushes and same-repo
    # PRs always deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # push to gh-pages
      pull-requests: write  # sticky PR preview comment
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # multiplexer reads full git history for the per-deploy commit manifest

      # [LAW:one-source-of-truth] This job compiles `src/` — docs:build bundles
      # examples/ through the demo tsconfig — so it must run a Node the package
      # supports, and `engines.node` is that declaration. ci.yml's setup-node
      # step owns the argument for reading it this way, range resolution
      # included; not restated here. The `node-version: 20` this replaces
      # encoded no constraint at all — it cleared vite's `^20.19.0` floor only
      # because setup-node resolves a bare major to its newest patch.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Build docs
        env:
          # docs/.vitepress/config.ts reads this. Must match the
          # `version:` input below exactly or every deep asset 404s.
          VITEPRESS_BASE: /${{ github.event.repository.name }}/${{ needs.slot.outputs.slot }}/
        run: npm run docs:build

      - uses: brandon-fryslie/gh-pages-multiplexer@v1.1.0
        with:
          source-dir: docs/.vitepress/dist
          version: ${{ needs.slot.outputs.slot }}
          # The VitePress build already emits absolute URLs rooted at
          # VITEPRESS_BASE — no post-hoc rewriting needed.
          base-path-mode: none
